version: '3.9'

services:

  postgres:

    image: postgres:16

    container_name: finbank-postgres

    restart: always

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: finbank

    ports:

      - "5433:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:7

    container_name: finbank-redis

    restart: always

    ports:

      - "6379:6379"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: finbank-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:

  postgres_data: